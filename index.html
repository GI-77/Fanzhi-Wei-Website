<script>

document.addEventListener("DOMContentLoaded", function () {

    const artworkScroll =
        document.querySelector(".artwork-scroll");

    const artworks =
        Array.from(
            document.querySelectorAll(".overview-artwork")
        );

    const prevButton =
        document.querySelector(".slider-prev");

    const nextButton =
        document.querySelector(".slider-next");


    if (
        !artworkScroll ||
        artworks.length === 0 ||
        !prevButton ||
        !nextButton
    ) {
        return;
    }


    /* =========================
       Create clones
    ========================= */

    const firstClone =
        artworks[0].cloneNode(true);

    const lastClone =
        artworks[artworks.length - 1].cloneNode(true);


    firstClone.classList.add("slider-clone");

    lastClone.classList.add("slider-clone");


    artworkScroll.appendChild(firstClone);

    artworkScroll.insertBefore(
        lastClone,
        artworkScroll.firstChild
    );


    const allArtworks =
        Array.from(
            artworkScroll.querySelectorAll(
                ".overview-artwork"
            )
        );


    /*
    Original first artwork is now index 1.
    */

    let currentIndex = 1;


    /* =========================
       Initial position
    ========================= */

    function setInitialPosition() {

        allArtworks[currentIndex].scrollIntoView({

            behavior: "instant",

            block: "nearest",

            inline: "center"

        });

    }


    setInitialPosition();


    /* =========================
       Move artwork
    ========================= */

    function moveTo(index) {

        currentIndex = index;


        allArtworks[currentIndex].scrollIntoView({

            behavior: "smooth",

            block: "nearest",

            inline: "center"

        });


        /*
        If moving to the clone,
        correct the position after
        the animation finishes.
        */

        setTimeout(function () {


            /*
            Last clone
            */

            if (currentIndex === 0) {

                currentIndex =
                    artworks.length;

                allArtworks[currentIndex].scrollIntoView({

                    behavior: "instant",

                    block: "nearest",

                    inline: "center"

                });

            }


            /*
            First clone
            */

            if (
                currentIndex ===
                allArtworks.length - 1
            ) {

                currentIndex = 1;

                allArtworks[currentIndex].scrollIntoView({

                    behavior: "instant",

                    block: "nearest",

                    inline: "center"

                });

            }

        }, 450);

    }


    /* =========================
       Next
    ========================= */

    nextButton.addEventListener(
        "click",
        function () {

            moveTo(
                currentIndex + 1
            );

        }
    );


    /* =========================
       Previous
    ========================= */

    prevButton.addEventListener(
        "click",
        function () {

            moveTo(
                currentIndex - 1
            );

        }
    );


    /* =========================
       Mouse wheel
    ========================= */

    artworkScroll.addEventListener(
        "wheel",
        function (event) {

            if (
                Math.abs(event.deltaY) <=
                Math.abs(event.deltaX)
            ) {

                return;

            }


            event.preventDefault();


            if (event.deltaY > 0) {

                moveTo(
                    currentIndex + 1
                );

            } else {

                moveTo(
                    currentIndex - 1
                );

            }

        },
        {
            passive: false
        }
    );

});

</script>
